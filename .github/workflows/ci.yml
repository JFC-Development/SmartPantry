name: CI 
  
on: 
  pull_request: 
  push: 
    branches: [main, stg, prod] 
  
jobs: 
  backend: 
    runs-on: ubuntu-latest 
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd123
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd123 -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps: 
      - uses: actions/checkout@v4 
      - uses: actions/setup-dotnet@v4 
        with: 
          dotnet-version: 10.0.x 
      - run: dotnet restore ./SmartPantry.slnx 
      - run: dotnet build ./SmartPantry.slnx --configuration Release --no-restore 
      - run: dotnet test ./SmartPantry.slnx --configuration Release --no-build
        env:
          TEST_CONNECTION_STRING: "Server=localhost,1433;Database=SmartPantry_Test;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=true" 
  
  frontend: 
    runs-on: ubuntu-latest 
    defaults: 
      run: 
        working-directory: angular 
    steps: 
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v4

        with:
          node-version: 24
      - run: corepack enable  
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test --watch=false 